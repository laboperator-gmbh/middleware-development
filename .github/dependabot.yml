version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    rebase-strategy: disabled
    ignore:
      # Newer version get stuck when running with supertest in CircleCI
      - dependency-name: fetch-mock
        versions:
          - '> 9.11.0'
      # Remove all of the following once laboperator-gmbh/config is updated
      - dependency-name: '@babel/*'
        versions:
          - '>= 8'
      - dependency-name: '@types/node'
        versions:
          - '>= 25'
      - dependency-name: eslint
        versions:
          - '>= 10'
    groups:
      # Listed first so every minor/patch lands here; the groups below only get majors
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      babel:
        patterns:
          - '@babel/*'
          - 'babel-*'
          - 'browserslist'
      eslint:
        patterns:
          - '@eslint-*'
          - '@eslint/*'
          - 'eslint-*'
          - 'eslint'
      jest:
        patterns:
          - '@jest/'
          - 'jest-*'
          - 'jest'
          - '@types/jest'
      laboperator-gmbh:
        patterns:
          - '@laboperator-gmbh/*'
